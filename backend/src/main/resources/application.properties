spring.application.name=physlive-backend
server.port=${SERVER_PORT}
server.shutdown=graceful
server.forward-headers-strategy=framework
server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-stacktrace=never
spring.lifecycle.timeout-per-shutdown-phase=30s

# Local values live in ignored backend/.env.local. Deployments inject the same
# variable names through their secret/configuration manager.
spring.config.import=optional:file:.env.local[.properties]
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration

spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.defer-datasource-initialization=false
spring.jpa.open-in-view=false

spring.flyway.enabled=${FLYWAY_ENABLED}
spring.flyway.baseline-on-migrate=${FLYWAY_BASELINE_ON_MIGRATE}
spring.flyway.baseline-version=0
spring.flyway.locations=classpath:db/migration
spring.sql.init.mode=${SQL_INIT_MODE}

# Catalog initialization is explicit because it writes reference data at startup.
physlive.bootstrap.catalogs-enabled=${BOOTSTRAP_CATALOGS_ENABLED}

spring.servlet.multipart.max-file-size=${MULTIPART_MAX_FILE_SIZE}
spring.servlet.multipart.max-request-size=${MULTIPART_MAX_REQUEST_SIZE}
physlive.upload.max-image-bytes=${MAX_IMAGE_BYTES}
physlive.upload.allowed-image-types=${ALLOWED_IMAGE_TYPES}

logging.level.root=INFO
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=INFO
logging.level.org.springframework.core.env=INFO
spring.mvc.log-request-details=false

management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true
management.endpoint.health.group.readiness.include=readinessState,db,schemaRouting
management.health.redis.enabled=${REDIS_HEALTH_ENABLED}
spring.data.redis.repositories.enabled=false
springdoc.api-docs.enabled=${SPRINGDOC_ENABLED}
springdoc.swagger-ui.enabled=${SPRINGDOC_ENABLED}

jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION_MS}

physlive.security.allowed-origins=${ALLOWED_ORIGINS}
physlive.security.password-strength=${PASSWORD_BCRYPT_STRENGTH}

physlive.ai.openrouter.api-key=${OPENROUTER_API_KEY}
physlive.ai.openrouter.base-url=${OPENROUTER_BASE_URL}
physlive.ai.openrouter.model=${OPENROUTER_MODEL}
physlive.ai.openrouter.ocr-model=${OPENROUTER_OCR_MODEL}
physlive.ai.openrouter.connect-timeout=${OPENROUTER_CONNECT_TIMEOUT_MS}ms
physlive.ai.openrouter.read-timeout=${OPENROUTER_READ_TIMEOUT_MS}ms
physlive.ai.openrouter.max-tokens=${OPENROUTER_MAX_TOKENS}
physlive.ai.openrouter.system-prompt-resource=${OPENROUTER_SYSTEM_PROMPT_RESOURCE}
physlive.ai.openrouter.ocr-prompt-resource=${OPENROUTER_OCR_PROMPT_RESOURCE}
physlive.ai.openrouter.app-url=${OPENROUTER_APP_URL}
physlive.ai.openrouter.app-name=${OPENROUTER_APP_NAME}

physlive.ai.jev.api-key=${JEV_API_KEY:}
physlive.ai.jev.base-url=${JEV_BASE_URL:https://api.typesafe.ai/v1}
physlive.ai.jev.model=${JEV_MODEL:jev-latest}
physlive.ai.jev.timeout=${JEV_TIMEOUT:60s}

physlive.ai.jev.candidate-top-k=${JEV_CANDIDATE_TOP_K:5}
physlive.ai.jev.minimum-confidence=${JEV_MINIMUM_CONFIDENCE:0.25}
physlive.ai.jev.minimum-margin=${JEV_MINIMUM_MARGIN:0.08}
physlive.ai.jev.maximum-query-characters=${JEV_MAXIMUM_QUERY_CHARACTERS:20000}
physlive.ai.jev.maximum-prompt-characters=${JEV_MAXIMUM_PROMPT_CHARACTERS:30000}

physlive.vnpay.tmn-code=${VNPAY_TMN_CODE}
physlive.vnpay.hash-secret=${VNPAY_HASH_SECRET}
physlive.vnpay.payment-url=${VNPAY_PAYMENT_URL}
physlive.vnpay.return-url=${VNPAY_RETURN_URL}
physlive.vnpay.query-url=${VNPAY_QUERY_URL}
physlive.vnpay.server-ip=${VNPAY_SERVER_IP}
physlive.vnpay.zone-id=${VNPAY_TIME_ZONE}
physlive.vnpay.connect-timeout=${VNPAY_CONNECT_TIMEOUT_MS}ms
physlive.vnpay.request-timeout=${VNPAY_REQUEST_TIMEOUT_MS}ms
physlive.license.warning-days=${LICENSE_WARNING_DAYS}
