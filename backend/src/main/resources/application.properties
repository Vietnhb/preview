spring.application.name=physlive-backend
server.port=${SERVER_PORT}
server.shutdown=graceful
server.forward-headers-strategy=framework
server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-stacktrace=never
spring.lifecycle.timeout-per-shutdown-phase=30s

# Local values live in ignored backend/.env.local. Resolve it both when the
# backend is started from its module directory and when Maven/IDE starts it
# from the repository root. Deployments inject the same names externally.
spring.config.import=optional:file:backend/.env.local[.properties],optional:file:.env.local[.properties]
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration

spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false
# Batch lazy relations so curriculum/library reads do not query once per child.
spring.jpa.properties.hibernate.default_batch_fetch_size=${DB_FETCH_BATCH_SIZE:64}

spring.flyway.enabled=${FLYWAY_ENABLED}
spring.flyway.baseline-on-migrate=${FLYWAY_BASELINE_ON_MIGRATE}
spring.flyway.baseline-version=0
spring.flyway.locations=classpath:db/migration

# Catalog initialization is explicit because it writes reference data at startup.
physlive.bootstrap.catalogs-enabled=${BOOTSTRAP_CATALOGS_ENABLED}

spring.servlet.multipart.max-file-size=${MULTIPART_MAX_FILE_SIZE}
spring.servlet.multipart.max-request-size=${MULTIPART_MAX_REQUEST_SIZE}
physlive.upload.max-image-bytes=${MAX_IMAGE_BYTES}
physlive.upload.allowed-image-types=${ALLOWED_IMAGE_TYPES}

logging.level.root=INFO
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=INFO
logging.level.org.springframework.core.env=INFO
spring.mvc.log-request-details=false

management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true
management.endpoint.health.group.readiness.include=readinessState,db
springdoc.api-docs.enabled=${SPRINGDOC_ENABLED}
springdoc.swagger-ui.enabled=${SPRINGDOC_ENABLED}

jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION_MS}

physlive.security.allowed-origins=${ALLOWED_ORIGINS}
physlive.security.password-strength=${PASSWORD_BCRYPT_STRENGTH}

# Text understanding and OCR use the configured chat-completions endpoint.
physlive.ai.provider.api-key=${AI_API_KEY}
physlive.ai.provider.base-url=${AI_BASE_URL}
physlive.ai.provider.text-model=${AI_TEXT_MODEL}
physlive.ai.provider.vision-model=${AI_VISION_MODEL}
physlive.ai.provider.understanding-temperature=${AI_UNDERSTANDING_TEMPERATURE}
physlive.ai.provider.connect-timeout=${AI_CONNECT_TIMEOUT_MS}ms
physlive.ai.provider.read-timeout=${AI_READ_TIMEOUT_MS}ms
physlive.ai.provider.ocr-prompt-resource=${AI_OCR_PROMPT_RESOURCE}

# Visual generation supports chat completions, OpenRouter, or Gemini interactions.
physlive.ai.visual.api-key=${AI_VISUAL_API_KEY}
physlive.ai.visual.provider=${AI_VISUAL_PROVIDER:openai_compatible}
physlive.ai.visual.base-url=${AI_VISUAL_BASE_URL}
physlive.ai.visual.model=${AI_VISUAL_MODEL}
physlive.ai.visual.temperature=${AI_VISUAL_TEMPERATURE}
physlive.ai.visual.read-timeout=${AI_VISUAL_READ_TIMEOUT_MS}ms
physlive.ai.visual.strict-structured-output=${AI_VISUAL_STRICT_STRUCTURED_OUTPUT}
physlive.ai.visual.supports-response-format=${AI_VISUAL_SUPPORTS_RESPONSE_FORMAT:true}
physlive.ai.visual.max-completion-tokens=${AI_VISUAL_MAX_COMPLETION_TOKENS}
physlive.ai.visual.reasoning-effort=${AI_VISUAL_REASONING_EFFORT:}

physlive.ai.jev.api-key=${JEV_API_KEY}
physlive.ai.jev.base-url=${JEV_BASE_URL}
physlive.ai.jev.model=${JEV_MODEL}
physlive.ai.jev.timeout=${JEV_TIMEOUT}

physlive.ai.jev.minimum-confidence=${JEV_MINIMUM_CONFIDENCE}
physlive.ai.jev.minimum-margin=${JEV_MINIMUM_MARGIN}
physlive.ai.jev.maximum-query-characters=${JEV_MAXIMUM_QUERY_CHARACTERS}
physlive.ai.jev.maximum-prompt-characters=${JEV_MAXIMUM_PROMPT_CHARACTERS}

physlive.vnpay.tmn-code=${VNPAY_TMN_CODE}
physlive.vnpay.hash-secret=${VNPAY_HASH_SECRET}
physlive.vnpay.payment-url=${VNPAY_PAYMENT_URL}
physlive.vnpay.return-url=${VNPAY_RETURN_URL}
physlive.vnpay.query-url=${VNPAY_QUERY_URL}
physlive.vnpay.server-ip=${VNPAY_SERVER_IP}
physlive.vnpay.zone-id=${VNPAY_TIME_ZONE}
physlive.vnpay.connect-timeout=${VNPAY_CONNECT_TIMEOUT_MS}ms
physlive.vnpay.request-timeout=${VNPAY_REQUEST_TIMEOUT_MS}ms
physlive.license.warning-days=${LICENSE_WARNING_DAYS}

# Community discussion limits.
physlive.community.comment-max-characters=${COMMUNITY_COMMENT_MAX_CHARACTERS:2000}
physlive.community.max-page-size=${COMMUNITY_MAX_PAGE_SIZE:50}

# Simulation limits are adjustable without modifying the physics runtime.
physlive.simulation.runtime.default-step-seconds=${SIMULATION_DEFAULT_STEP_SECONDS:0.02}
physlive.simulation.runtime.max-duration-seconds=${SIMULATION_MAX_DURATION_SECONDS:3.2e9}
physlive.simulation.runtime.max-samples=${SIMULATION_MAX_SAMPLES:16384}
physlive.simulation.runtime.max-participants=${SIMULATION_MAX_PARTICIPANTS:256}
physlive.simulation.runtime.max-equation-depth=${SIMULATION_MAX_EQUATION_DEPTH:32}
physlive.simulation.runtime.max-equation-nodes=${SIMULATION_MAX_EQUATION_NODES:512}
physlive.simulation.runtime.min-presentation-seconds=${SIMULATION_MIN_PRESENTATION_SECONDS:0.1}
physlive.simulation.runtime.max-presentation-seconds=${SIMULATION_MAX_PRESENTATION_SECONDS:40}
physlive.simulation.runtime.max-visual-controls=${SIMULATION_MAX_VISUAL_CONTROLS:30}
physlive.simulation.runtime.max-program-part-characters=${SIMULATION_MAX_PROGRAM_PART_CHARACTERS:50000}
physlive.simulation.runtime.max-state-bytes=${SIMULATION_MAX_STATE_BYTES:262144}
physlive.simulation.runtime.max-draw-commands-per-frame=${SIMULATION_MAX_DRAW_COMMANDS_PER_FRAME:1000}
physlive.simulation.runtime.max-phase-operations=${SIMULATION_MAX_PHASE_OPERATIONS:2000}
physlive.simulation.runtime.max-call-depth=${SIMULATION_MAX_CALL_DEPTH:128}
physlive.simulation.runtime.max-array-entries=${SIMULATION_MAX_ARRAY_ENTRIES:2000}
