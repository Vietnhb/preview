spring.application.name=physlive-backend
server.port=${SERVER_PORT}
server.shutdown=graceful
server.forward-headers-strategy=framework
server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-stacktrace=never
spring.lifecycle.timeout-per-shutdown-phase=30s

# Local values live in ignored backend/.env.local. Deployments inject the same
# variable names through their secret/configuration manager.
spring.config.import=optional:file:.env.local[.properties]
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration

spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.defer-datasource-initialization=false
spring.jpa.open-in-view=false

spring.flyway.enabled=${FLYWAY_ENABLED}
spring.flyway.baseline-on-migrate=${FLYWAY_BASELINE_ON_MIGRATE}
spring.flyway.baseline-version=0
spring.flyway.locations=classpath:db/migration
spring.sql.init.mode=${SQL_INIT_MODE}

# Catalog initialization is explicit because it writes reference data at startup.
physlive.bootstrap.catalogs-enabled=${BOOTSTRAP_CATALOGS_ENABLED}

spring.servlet.multipart.max-file-size=${MULTIPART_MAX_FILE_SIZE}
spring.servlet.multipart.max-request-size=${MULTIPART_MAX_REQUEST_SIZE}
physlive.upload.max-image-bytes=${MAX_IMAGE_BYTES}
physlive.upload.allowed-image-types=${ALLOWED_IMAGE_TYPES}

logging.level.root=INFO
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=INFO
logging.level.org.springframework.core.env=INFO
spring.mvc.log-request-details=false

management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true
management.endpoint.health.group.readiness.include=readinessState,db,schemaRouting
management.health.redis.enabled=${REDIS_HEALTH_ENABLED}
spring.data.redis.repositories.enabled=false
springdoc.api-docs.enabled=${SPRINGDOC_ENABLED}
springdoc.swagger-ui.enabled=${SPRINGDOC_ENABLED}

jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION_MS}

physlive.security.allowed-origins=${ALLOWED_ORIGINS}
physlive.security.password-strength=${PASSWORD_BCRYPT_STRENGTH}

physlive.ai.openrouter.api-key=${OPENROUTER_API_KEY}
physlive.ai.openrouter.base-url=${OPENROUTER_BASE_URL}
physlive.ai.openrouter.model=${OPENROUTER_MODEL}
physlive.ai.openrouter.ocr-model=${OPENROUTER_OCR_MODEL}
physlive.ai.openrouter.connect-timeout=${OPENROUTER_CONNECT_TIMEOUT_MS}ms
physlive.ai.openrouter.read-timeout=${OPENROUTER_READ_TIMEOUT_MS}ms
physlive.ai.openrouter.max-tokens=${OPENROUTER_MAX_TOKENS}
physlive.ai.openrouter.system-prompt-resource=${OPENROUTER_SYSTEM_PROMPT_RESOURCE}
physlive.ai.openrouter.ocr-prompt-resource=${OPENROUTER_OCR_PROMPT_RESOURCE}
physlive.ai.openrouter.app-url=${OPENROUTER_APP_URL}
physlive.ai.openrouter.app-name=${OPENROUTER_APP_NAME}

physlive.ai.jev.api-key=${JEV_API_KEY:}
physlive.ai.jev.base-url=${JEV_BASE_URL:https://api.typesafe.ai/v1}
physlive.ai.jev.model=${JEV_MODEL:jev-latest}
physlive.ai.jev.timeout=${JEV_TIMEOUT:60s}

physlive.schema-routing.enabled=${PHYSLIVE_SCHEMA_ROUTING_ENABLED:true}
physlive.schema-routing.legacy-index-startup=${PHYSLIVE_SCHEMA_LEGACY_INDEX_STARTUP:false}
physlive.schema-routing.lexical-top-k=${PHYSLIVE_SCHEMA_LEXICAL_TOP_K:20}
physlive.schema-routing.vector-top-k=${PHYSLIVE_SCHEMA_VECTOR_TOP_K:20}
physlive.schema-routing.candidate-top-k=${PHYSLIVE_SCHEMA_CANDIDATE_TOP_K:5}
physlive.schema-routing.rrf-k=${PHYSLIVE_SCHEMA_RRF_K:60}
physlive.schema-routing.minimum-score=${PHYSLIVE_SCHEMA_MINIMUM_SCORE:0.25}
physlive.schema-routing.minimum-margin=${PHYSLIVE_SCHEMA_MINIMUM_MARGIN:0.08}
physlive.schema-routing.maximum-query-characters=${PHYSLIVE_SCHEMA_MAXIMUM_QUERY_CHARACTERS:20000}
physlive.schema-routing.maximum-prompt-characters=${PHYSLIVE_SCHEMA_MAXIMUM_PROMPT_CHARACTERS:30000}
physlive.schema-routing.quantity-association-window-characters=${PHYSLIVE_SCHEMA_QUANTITY_ASSOCIATION_WINDOW_CHARACTERS:64}
physlive.schema-routing.bm25-k1=${PHYSLIVE_SCHEMA_BM25_K1:1.2}
physlive.schema-routing.bm25-b=${PHYSLIVE_SCHEMA_BM25_B:0.75}
physlive.schema-routing.minimum-evidence-score=${PHYSLIVE_SCHEMA_MINIMUM_EVIDENCE_SCORE:0.15}
physlive.schema-routing.required-quantity-weight=${PHYSLIVE_SCHEMA_REQUIRED_QUANTITY_WEIGHT:0.55}
physlive.schema-routing.unit-compatibility-weight=${PHYSLIVE_SCHEMA_UNIT_WEIGHT:0.25}
physlive.schema-routing.metadata-weight=${PHYSLIVE_SCHEMA_METADATA_WEIGHT:0.20}
physlive.schema-routing.contradiction-penalty-weight=${PHYSLIVE_SCHEMA_CONTRADICTION_PENALTY_WEIGHT:1.0}
physlive.schema-routing.embedding.provider=${PHYSLIVE_SCHEMA_EMBEDDING_PROVIDER:openrouter}
physlive.schema-routing.embedding.model=${PHYSLIVE_SCHEMA_EMBEDDING_MODEL:openai/text-embedding-3-small}
physlive.schema-routing.embedding.dimension=${PHYSLIVE_SCHEMA_EMBEDDING_DIMENSION:1536}
physlive.schema-routing.embedding.timeout=${PHYSLIVE_SCHEMA_EMBEDDING_TIMEOUT:10s}
physlive.schema-routing.embedding.max-attempts=${PHYSLIVE_SCHEMA_EMBEDDING_MAX_ATTEMPTS:2}
physlive.schema-routing.embedding.retry-backoff=${PHYSLIVE_SCHEMA_EMBEDDING_RETRY_BACKOFF:100ms}

physlive.vnpay.tmn-code=${VNPAY_TMN_CODE}
physlive.vnpay.hash-secret=${VNPAY_HASH_SECRET}
physlive.vnpay.payment-url=${VNPAY_PAYMENT_URL}
physlive.vnpay.return-url=${VNPAY_RETURN_URL}
physlive.vnpay.query-url=${VNPAY_QUERY_URL}
physlive.vnpay.server-ip=${VNPAY_SERVER_IP}
physlive.vnpay.zone-id=${VNPAY_TIME_ZONE}
physlive.vnpay.connect-timeout=${VNPAY_CONNECT_TIMEOUT_MS}ms
physlive.vnpay.request-timeout=${VNPAY_REQUEST_TIMEOUT_MS}ms
physlive.license.warning-days=${LICENSE_WARNING_DAYS}
