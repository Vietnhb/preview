apiVersion: apps/v1
kind: Deployment
metadata: { name: physlive-backend, namespace: physlive }
spec:
  replicas: 2
  selector: { matchLabels: { app: physlive-backend } }
  template:
    metadata: { labels: { app: physlive-backend } }
    spec:
      containers:
        - name: backend
          image: physlive/backend:latest
          ports: [{ containerPort: 8080 }]
          envFrom: [{ secretRef: { name: physlive-secrets } }]
          readinessProbe: { httpGet: { path: /actuator/health, port: 8080 }, initialDelaySeconds: 20 }
---
apiVersion: v1
kind: Service
metadata: { name: physlive-backend, namespace: physlive }
spec:
  selector: { app: physlive-backend }
  ports: [{ port: 8080, targetPort: 8080 }]
