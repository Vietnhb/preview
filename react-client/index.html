<!doctype html>
<html lang="vi">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#f5f7fa" />
  <script>
    // Apply the saved theme before first paint (same rules as src/shared/theme/themeStore.ts).
    (function () {
      var mode = "system";
      try { var stored = localStorage.getItem("physlive.theme"); if (stored === "light" || stored === "dark" || stored === "system") mode = stored; } catch (error) { /* storage unavailable */ }
      var dark = mode === "dark" || (mode === "system" && window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches);
      var root = document.documentElement;
      root.dataset.theme = mode;
      root.dataset.themeEffective = dark ? "dark" : "light";
      root.style.colorScheme = dark ? "dark" : "light";
      root.classList.add(dark ? "dark" : "light");
    })();
  </script>
  <link rel="icon" href="/favicon.ico" sizes="any" />
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
  <link rel="manifest" href="/site.webmanifest" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" />
  <meta name="description" content="PhysLive — phòng thí nghiệm Vật lý số cho trường THPT: mô phỏng tương tác đã kiểm chứng, giao bài và chấm bài trên trình duyệt." />
  <title>PhysLive — Phòng thí nghiệm Vật lý số</title>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
