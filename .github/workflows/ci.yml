name: physlive-preview-ci
on: [push, pull_request]
jobs:
  backend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21' }
      - run: ./mvnw test
  web:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: react-client } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: react-client/package-lock.json }
      - run: npm ci
      - run: npm run lint
      - run: npm run build
  python:
    runs-on: ubuntu-latest
    strategy: { matrix: { service: [problem-understanding-service, simulation-service, validation-service] } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install -r requirements.txt
        working-directory: ${{ matrix.service }}
      - run: python -m pytest -q
        working-directory: ${{ matrix.service }}
